plugins {
    id "com.gradleup.shadow"
    id "multiloader-loader"
    id "net.fabricmc.fabric-loom"
}

def runtimeBenchmarkSeed = providers.gradleProperty("runtimeBenchmarkSeed").orElse("8675309").get()
def runtimeBenchmarkWarmup = providers.gradleProperty("runtimeBenchmarkWarmupTicks").orElse("200").get()
def runtimeBenchmarkTicks = providers.gradleProperty("runtimeBenchmarkMeasureTicks").orElse("600").get()
def runtimeBenchmarkCows = providers.gradleProperty("runtimeBenchmarkCows").orElse("300").get()
def runtimeBenchmarkItems = providers.gradleProperty("runtimeBenchmarkItems").orElse("400").get()
def fabricBenchmarkReportDir = layout.buildDirectory.dir("reports/wyml-runtime")
def runtimeProfiles = rootProject.ext.runtimeBenchmarkProfiles
def runtimeRepetitions = rootProject.ext.runtimeBenchmarkRepetitions.get()
def benchmarkTaskSuffix = rootProject.ext.runtimeBenchmarkTaskSuffix

configurations {
    devRuntime
    runtimeClasspath.extendsFrom(devRuntime)
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "net.creeperhost.polylib:polylib-fabric:${polylib_version}"
    compileOnly "dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks_version}"
    devRuntime "dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks_version}"

    implementation "blue.endless:jankson:1.2.1"
    shadow("blue.endless:jankson:1.2.1") { transitive = false }
}

loom {
    accessWidenerPath = project(":common").file("src/main/resources/wyml.accesswidener")
    runs {
        client {
            client()
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            ideConfigGenerated(true)
            runDir("runs/server")
        }
        runtimeProfiles.each { profile, profileConfig ->
            def profileWarmup = profileConfig.containsKey("warmupTicks") ? profileConfig.warmupTicks : runtimeBenchmarkWarmup
            def profileCows = profileConfig.containsKey("cows") ? profileConfig.cows : runtimeBenchmarkCows
            def profileItems = profileConfig.containsKey("items") ? profileConfig.items : runtimeBenchmarkItems
            def expectedLiveItems = profileConfig.containsKey("expectedLiveItems") ? profileConfig.expectedLiveItems : profileItems
            def workload = profileConfig.containsKey("workload") ? profileConfig.workload : "dense"
            def spreadItems = profileConfig.containsKey("spreadItems") && profileConfig.spreadItems
            def expectedPaperBags = profileConfig.containsKey("expectedPaperBags") ? profileConfig.expectedPaperBags : 0
            def expectedPaperBagItems = profileConfig.containsKey("expectedPaperBagItems") ? profileConfig.expectedPaperBagItems : 0
            (1..runtimeRepetitions).each { repetition ->
                def runName = "benchmark${benchmarkTaskSuffix(profile)}Run${repetition}"
                def runDirectory = "runs/runtime-benchmark-${profile}-run-${repetition}"
                create(runName) {
                    server()
                    ideConfigGenerated(false)
                    runDir(runDirectory)
                    property("wyml.configDir", file("${runDirectory}/config").absolutePath)
                    property("wyml.runtimeBenchmark.enabled", "true")
                    property("wyml.runtimeBenchmark.loader", "fabric")
                    property("wyml.runtimeBenchmark.profile", profile)
                    property("wyml.runtimeBenchmark.repetition", repetition.toString())
                    property("wyml.runtimeBenchmark.workload", workload.toString())
                    property("wyml.runtimeBenchmark.wymlEnabled", profileConfig.wymlEnabled.toString())
                    property("wyml.runtimeBenchmark.seed", runtimeBenchmarkSeed)
                    property("wyml.runtimeBenchmark.warmupTicks", profileWarmup.toString())
                    property("wyml.runtimeBenchmark.measureTicks", runtimeBenchmarkTicks)
                    property("wyml.runtimeBenchmark.cows", profileCows.toString())
                    property("wyml.runtimeBenchmark.items", profileItems.toString())
                    property("wyml.runtimeBenchmark.expectedLiveItems", expectedLiveItems.toString())
                    property("wyml.runtimeBenchmark.spreadItems", spreadItems.toString())
                    property("wyml.runtimeBenchmark.expectedPaperBags", expectedPaperBags.toString())
                    property("wyml.runtimeBenchmark.expectedPaperBagItems", expectedPaperBagItems.toString())
                    property("wyml.runtimeBenchmark.output", fabricBenchmarkReportDir.get().file(
                            "raw/${profile}/run-${repetition}.json").asFile.absolutePath)
                    property("wyml.runtimeBenchmark.worldDirectory", file("${runDirectory}/world").absolutePath)
                }
            }
        }
    }
}

runtimeProfiles.each { profile, profileConfig ->
    (1..runtimeRepetitions).each { repetition ->
        def suffix = "${benchmarkTaskSuffix(profile)}Run${repetition}"
        def runDirectory = file("runs/runtime-benchmark-${profile}-run-${repetition}")
        def reportFile = fabricBenchmarkReportDir.get().file("raw/${profile}/run-${repetition}.json").asFile
        def modules = profileConfig.modules
        def itemDespawnTime = profileConfig.containsKey("itemDespawnTime") ? profileConfig.itemDespawnTime : 6000
        def allowPaperBags = profileConfig.containsKey("allowPaperBags") && profileConfig.allowPaperBags
        def paperBagMinimumAge = profileConfig.containsKey("paperBagMinimumAge") ? profileConfig.paperBagMinimumAge : 60
        tasks.register("prepareRuntimeBenchmark${suffix}") {
            outputs.upToDateWhen { false }
            doLast {
                delete(reportFile)
                def configDirectory = new File(runDirectory, "config")
                delete(new File(runDirectory, "world"))
                delete(configDirectory)
                configDirectory.mkdirs()
                new File(runDirectory, "eula.txt").setText("eula=true\n", "UTF-8")
                new File(runDirectory, "server.properties").setText("""\
level-name=world
level-seed=${runtimeBenchmarkSeed}
online-mode=false
server-port=0
spawn-protection=0
view-distance=4
simulation-distance=4
max-tick-time=0
generate-structures=false
difficulty=normal
gamemode=creative
""", "UTF-8")
                new File(configDirectory, "wyml.json").setText("""{
  \"ENABLE_WYML\": ${profileConfig.wymlEnabled},
  \"ENABLE_GARBAGE_COLLECTION_LOAD\": false,
  \"CLEAN_PRINT\": false,
  \"DEBUG_PRINT\": false,
  \"ALLOW_PAPER_BAGS\": ${allowPaperBags},
  \"MIN_ITEM_AGE\": ${paperBagMinimumAge},
  \"MIN_ITEM_COUNT\": 20,
  \"PAPER_BAG_EXPIRY_POLICY\": \"persist_while_non_empty\",
  \"ITEM_DESPAWN_TIME\": ${itemDespawnTime},
  \"ALLOW_PAUSE\": ${modules.spawn_controller},
  \"ALLOW_SLOW\": ${modules.spawn_controller},
  \"ENABLE_CATEGORY_CAP_POLICY\": ${modules.category_policy},
  \"ENABLE_PER_MOD_CONFIGS\": ${modules.per_mob_rules},
  \"HARD_MOB_LIMITS\": false,
  \"NORMALIZE_ITEM_STACK_MERGING\": ${modules.item_merging},
  \"NORMALIZE_PUSHING\": ${modules.entity_pushing}
}
""", "UTF-8")
                new File(configDirectory, "wyml-mixins.properties").setText("""\
master_enabled=${profileConfig.wymlEnabled}
spawn_controller=${modules.spawn_controller}
category_policy=${modules.category_policy}
per_mob_rules=${modules.per_mob_rules}
paper_bags=${modules.paper_bags}
item_lifetime=${modules.item_lifetime}
item_merging=${modules.item_merging}
entity_pushing=${modules.entity_pushing}
tick_pacing=false
post_load_gc=false
numeric_ping=false
""", "UTF-8")
            }
        }
        tasks.named("runBenchmark${suffix}") {
            dependsOn tasks.named("prepareRuntimeBenchmark${suffix}")
            doLast {
                if (!reportFile.isFile()) {
                    throw new GradleException("Fabric runtime benchmark ${profile} run ${repetition} exited without producing ${reportFile}")
                }
            }
        }
    }
}

jar {
    archiveClassifier = "dev"
}

shadowJar {
    dependsOn(jar)
    configurations = [project.configurations.shadow]
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    relocate "blue.endless.jankson", "net.creeperhost.wyml.blue.endless.jankson"
    archiveClassifier = null
}

configurations {
    [apiElements, runtimeElements].each { config ->
        config.outgoing.artifacts.clear()
        config.outgoing.artifact(shadowJar)
    }
}

assemble.dependsOn(shadowJar)

publishing {
    publications.named("mavenJava", MavenPublication) {
        artifactId = "${archives_base_name}-fabric"
    }
}
